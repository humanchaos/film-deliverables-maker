<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Industry Standard Deliverables Maker - Comprehensive AI-powered video analysis with 6 powerful modes: Synopsis, Bios, Graphics, Fauna, Transcription, and Shot Lists" />
  <meta name="keywords"
    content="video analysis, AI, Gemini, transcription, shot list, synopsis, video editing, post-production, terra mater" />
  <meta name="author" content="Terra Mater Studios" />

  <!-- Open Graph / Social Media -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Industry Standard Deliverables Maker" />
  <meta property="og:description" content="6 AI-powered video analysis modes in one unified application" />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />

  <!-- Title -->
  <title>Industry Standard Deliverables Maker</title>

  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <!-- Scripts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.28.0",
    "@vitejs/plugin-react": "https://aistudiocdn.com/@vitejs/plugin-react@^5.1.0",
    "vite": "https://aistudiocdn.com/vite@^7.2.1",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.552.0"
  }
}
</script>

  <style>
    /* Loading screen styles */
    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #1f2937 0%, #111827 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.3s ease-out;
    }

    #loading-screen.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .loader {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(139, 92, 246, 0.2);
      border-top-color: #8b5cf6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .loading-text {
      margin-top: 20px;
      color: #9ca3af;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
    }
  </style>
  <link rel="stylesheet" href="/index.css">
</head>

<body>
  <!-- Loading Screen -->
  <div id="loading-screen">
    <div class="loader"></div>
    <div class="loading-text">Loading Industry Standard Deliverables Maker...</div>
  </div>

  <!-- React Root -->
  <div id="root"></div>

  <!-- Main Script -->
  <script type="module" src="/index.tsx"></script>

  <!-- Remove loading screen once app loads -->
  <script>
      window.addEventListener('load', () => {
        setTimeout(() => {
          const loadingScreen = document.getElementById('loading-screen');
          if (loadingScreen) {
            loadingScreen.classList.add('fade-out');
            setTimeout(() => {
              loadingScreen.remove();
            }, 300);
          }
        }, 500);
      });
  </script>

  <!-- No JavaScript fallback -->
  <noscript>
    <div style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #1f2937;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-family: system-ui;
        text-align: center;
        padding: 20px;
      ">
      <div>
        <h1 style="font-size: 24px; margin-bottom: 16px;">JavaScript Required</h1>
        <p style="color: #9ca3af;">
          Industry Standard Deliverables Maker requires JavaScript to be enabled.<br>
          Please enable JavaScript in your browser settings to use this application.
        </p>
      </div>
    </div>
  </noscript>
</body>

</html>
